<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitBharat</title>
<meta name="description" content="FitBharat: Indian food calorie tracker, desi home workouts with voice coach. Har Ghar Fit India.">
<meta name="theme-color" content="#0E1411" id="metaTheme">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FitBharat">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#FBF6EE;--card:#FFFFFF;--card2:#F6EEE1;--fg:#1B1713;--muted:#6B6258;--line:#E9DDCB;--track:#EFE5D5;
  --accent:#FF9933;--on-accent:#1B1713;--acc-text:#B45309;--pro:#1E9A5F;--carb:#D99A00;--fat:#2F6FDB;--danger:#C62828;--ok:#1E9A5F;
  --shadow:0 1px 2px rgba(60,40,10,.06),0 10px 26px rgba(60,40,10,.08);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Mukta",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1411;--card:#16201A;--card2:#1E2A23;--fg:#F3EFE7;--muted:#9BA89F;--line:#27342C;--track:#243029;--acc-text:#FFB366;
  --pro:#3DD68C;--carb:#F5C542;--fat:#5AA2FF;--danger:#FF6B6B;--ok:#3DD68C;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411;--card:#16201A;--card2:#1E2A23;--fg:#F3EFE7;--muted:#9BA89F;--line:#27342C;--track:#243029;--acc-text:#FFB366;
  --pro:#3DD68C;--carb:#F5C542;--fat:#5AA2FF;--danger:#FF6B6B;--ok:#3DD68C;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
body.lock{overflow:hidden}
h1,h2,h3,p{margin:0}
h1{font-size:1.5rem;line-height:1.2;letter-spacing:-.01em}
h2{font-size:1.08rem;line-height:1.25}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:48px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:.85rem}.num{font-variant-numeric:tabular-nums}
.hidden,[hidden]{display:none!important}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.screen{display:none;padding:16px;flex-direction:column;gap:14px}
.screen.on{display:flex;animation:enter .3s ease both}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:12px;min-width:0}.grow{flex:1;min-width:0}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.btn{background:linear-gradient(135deg,#FFAA4D,#FF8A1F);color:#1B1713;border:0;border-radius:16px;padding:12px 18px;font-weight:800;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;box-shadow:0 6px 16px rgba(255,138,31,.32);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:var(--danger);color:#fff;box-shadow:none}
.btn.sm{min-height:40px;padding:6px 16px;font-size:.92rem;border-radius:13px}
.btn.blue{background:linear-gradient(135deg,#5AA2FF,#2F6FDB);color:#fff;box-shadow:0 6px 16px rgba(47,111,219,.3)}
.ib{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:1.3rem;line-height:1;padding:0;flex:none}
.ib[disabled]{opacity:.35}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:.8rem;color:var(--muted);background:var(--card)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:8px 14px;min-height:42px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1B1713}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800}
.msg{color:var(--danger);font-size:.85rem;min-height:1.1em}

/* splash */
#splash{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(120% 80% at 50% 28%,#3a2308 0%,#17110a 38%,#0E1411 72%);color:#fff;transition:opacity .5s ease;padding:24px;text-align:center}
#splash.hide{opacity:0;pointer-events:none}
#splash .logo{width:132px;height:132px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(255,153,51,0))}50%{transform:scale(1.08);filter:drop-shadow(0 0 24px rgba(255,153,51,.6))}}
#splash h1{font-size:2.1rem}#splash h1 b{color:#FF9933}
#splash .tag{color:#d8cdbd;font-size:1.02rem;letter-spacing:.04em}
.sp-bar{width:min(240px,62vw);height:5px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:10px}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF9933,#FFC98A);animation:load 2s linear forwards}
@keyframes load{to{width:100%}}

/* floating bottom nav */
nav#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(536px,calc(100% - 24px));z-index:50;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 34px rgba(0,0,0,.18);padding:6px;display:flex;gap:4px}
nav#nav button{flex:1;background:none;border:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;color:var(--muted);font-size:.72rem;font-weight:800;min-height:56px;transition:background .2s,color .2s}
nav#nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
nav#nav button[aria-current="page"]{color:#1B1713;background:linear-gradient(135deg,#FFB35E,#FF9933)}
nav#nav button[aria-current="page"] svg{transform:translateY(-1px) scale(1.12)}

.install{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#2a1a08,#14201a);color:#fff;border-radius:20px;padding:12px 14px;border:1px solid #4a3414}
.install .t{flex:1;min-width:0}.install b{display:block}.install small{color:#d8cdbd}
.install .x{background:none;border:0;color:#d8cdbd;font-size:1.4rem;width:36px;height:36px}

/* home */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.streak{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#FF9933,#FF5E3A);color:#fff;border-radius:99px;padding:6px 12px;font-weight:800;font-size:.85rem;box-shadow:0 6px 16px rgba(255,94,58,.3)}
.streak.off{background:var(--card2);color:var(--muted);box-shadow:none}
.hero{background:linear-gradient(150deg,#1b2a21 0%,#2b1c09 100%);color:#fff;border-radius:28px;padding:18px;position:relative;overflow:hidden;box-shadow:0 16px 36px rgba(255,120,20,.2);display:flex;flex-direction:column;gap:14px}
.hero::before{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,153,51,.38),transparent 65%);pointer-events:none}
.hero::after{content:"";position:absolute;left:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(61,214,140,.18),transparent 65%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.rings{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.ringbox{position:relative;width:190px;height:190px;flex:none}
.ringbox svg{width:100%;height:100%;display:block}
.ringbox .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.ringbox .big{font-size:2rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.ringbox .sub{font-size:.78rem;color:#cfd8d2}
.rg{transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1)}
.legend{flex:1;min-width:160px;display:flex;flex-direction:column;gap:11px}
.lg .hd{display:flex;align-items:center;gap:8px;font-size:.86rem}
.lg .hd i{width:10px;height:10px;border-radius:50%;flex:none}
.lg .nm{flex:1;font-weight:700}.lg .vl{color:#cfd8d2;font-variant-numeric:tabular-nums;font-size:.8rem}
.lg .pb{height:6px;border-radius:99px;background:rgba(255,255,255,.12);margin-top:5px;overflow:hidden}
.lg .pb b{display:block;height:100%;border-radius:99px;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.water{display:flex;gap:16px;align-items:center}
.bottle{width:78px;height:136px;flex:none}
.bottle .bo{fill:none;stroke:var(--fat);stroke-width:3}
.bottle .wave{fill:var(--fat);opacity:.85;animation:wv 2.4s linear infinite}
.bottle .wave2{fill:var(--fat);opacity:.45;animation:wv 3.4s linear infinite reverse}
@keyframes wv{to{transform:translateX(80px)}}
.wbig{font-size:1.9rem;font-weight:900;line-height:1}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#5AA2FF,#2F6FDB);transition:width .6s ease}
.tip{background:linear-gradient(135deg,var(--card),var(--card2));display:flex;flex-direction:row;gap:14px;align-items:flex-start}
.tip .em{font-size:2rem;line-height:1}
.wkcard{flex-direction:row;align-items:center;gap:14px}
.wkdots{display:flex;gap:6px}
.wkdots span{width:26px;height:26px;border-radius:50%;background:var(--track);display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:800;color:var(--muted)}
.wkdots span.on{background:linear-gradient(135deg,#FF9933,#E8590C);color:#fff}
.wkdots span.now{outline:2px solid var(--accent);outline-offset:2px}
.week{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:4px}
.week .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.week .b{width:100%;max-width:34px;border-radius:9px 9px 4px 4px;background:var(--track);min-height:4px}
.week .b.t{background:linear-gradient(180deg,#FFB35E,#FF8A1F)}.week .b.o{background:var(--danger)}
.week .d{font-size:.72rem;color:var(--muted)}
.badges{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x proximity}
.badge{flex:none;width:92px;text-align:center;border-radius:18px;padding:10px 6px;background:var(--card2);scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;font-weight:700}
.badge .ic{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;background:linear-gradient(135deg,#FFD08A,#FF9933)}
.badge.lock{opacity:.5}.badge.lock .ic{background:var(--track);filter:grayscale(1)}

/* log */
.datebar{display:flex;align-items:center;gap:10px}.datebar .lbl{flex:1;text-align:center;font-weight:800}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.sum div{background:var(--card2);border-radius:14px;padding:8px 2px}
.sum b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums}.sum span{font-size:.7rem;color:var(--muted)}
.mh{display:flex;align-items:center;gap:10px}
.mh .mi{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex:none}
.mi.b{background:#FFE9C7}.mi.l{background:#D9F5E6}.mi.s{background:#FFE0D6}.mi.d{background:#DCE8FF}
.entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.entry .em{font-size:1.5rem;width:36px;text-align:center}
.entry .nm{flex:1;min-width:0;overflow-wrap:anywhere}.entry .kc{font-weight:800;font-variant-numeric:tabular-nums}
.entry .x{background:none;border:0;color:var(--muted);font-size:1.4rem;width:40px;height:40px;border-radius:10px}
.empty{color:var(--muted);font-size:.92rem}

/* sheet */
#sheet{position:fixed;inset:0;z-index:120;display:none}#sheet.open{display:block}
#sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .2s ease both}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;background:var(--bg);border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1) both;padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes up{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}
#sheet .hd{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
#sheet .bd{padding:4px 16px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.frow{display:flex;align-items:center;gap:12px;padding:10px 0;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:left;min-height:58px}
.frow:first-child{border-top:0}.frow .em{font-size:1.5rem;width:40px;height:40px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:none}
.frow .n{flex:1;min-width:0}.frow .s{font-size:.8rem;color:var(--muted)}
.stepper{display:flex;gap:8px;align-items:center}.stepper input{text-align:center;font-weight:800;max-width:120px}
.oil{display:flex;flex-direction:column;gap:6px;background:var(--card2);border-radius:18px;padding:12px}
.oil input[type=range]{padding:0;min-height:32px;accent-color:#FF8A1F;border:0;background:transparent}
.oil .lbs{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);gap:4px}
.oil .lbs span{flex:1;text-align:center}.oil .lbs span:first-child{text-align:left}.oil .lbs span:last-child{text-align:right}
.oil .lbs span.on{color:var(--acc-text);font-weight:900}
.prev{background:linear-gradient(150deg,#1b2a21,#2b1c09);color:#fff;border-radius:20px;padding:14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.prev b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}.prev span{font-size:.72rem;color:#cfd8d2}

/* workouts */
.wcard{padding:0;overflow:hidden}
.wcard .wh{display:flex;gap:14px;padding:14px;color:#fff;align-items:center;position:relative}
.wcard .wh .fig{width:92px;height:92px;flex:none;background:rgba(0,0,0,.22);border-radius:18px}
.wcard .wh h2{color:#fff}.wcard .wh p{color:rgba(255,255,255,.85);font-size:.85rem}
.wcard .wb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.wcard .btn{width:100%}
.exrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.exrow:first-child{border-top:0}
.exrow .fig{width:58px;height:58px;flex:none;background:#241a10;border-radius:14px}
.exrow .tx{font-size:.88rem;min-width:0}.exrow b{display:block}
details summary{cursor:pointer;font-weight:800;min-height:36px;display:flex;align-items:center}
.fig{display:block}
.fig .nr{stroke:#FFC27A;stroke-width:7;stroke-linecap:round;fill:none}
.fig .fr{stroke:#B3702F;stroke-width:7;stroke-linecap:round;fill:none}
.fig .tor{stroke:#FF9933;stroke-width:10;stroke-linecap:round;fill:none}
.fig .hd{fill:#FFE6CC}.fig .gl{stroke:rgba(255,255,255,.22);stroke-width:2}.fig .shd{fill:rgba(0,0,0,.28)}
.kpis{display:flex;gap:10px}
.kpi{flex:1;display:flex;flex-direction:column;gap:2px;background:var(--card2);border-radius:16px;padding:10px 12px}
.kpi b{font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}

/* runner */
#runner{position:fixed;inset:0;z-index:130;background:var(--bg);display:none;flex-direction:column;align-items:center;gap:10px;padding:12px 16px;overflow-y:auto;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:center}
#runner.open{display:flex;animation:fade .2s ease both}
.rin{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:10px}
.rtop{display:flex;align-items:center;gap:10px;width:100%}
.segs{flex:1;display:flex;gap:3px;min-width:0}.segs i{flex:1;height:5px;border-radius:99px;background:var(--track)}
.segs i.dn{background:var(--accent)}.segs i.on{background:linear-gradient(90deg,#FFB35E,#E8590C)}
.rfig{width:100%;max-width:330px;aspect-ratio:1.25;border-radius:26px;position:relative;overflow:hidden;box-shadow:var(--shadow);background:#241a10}
.rfig .fig{width:100%;height:100%}
.rph{font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:.85rem;padding:4px 14px;border-radius:99px}
.rph.work{background:#FFE9C7;color:#9A3412}.rph.rest{background:#D9F5E6;color:#14532D}.rph.ready{background:#DCE8FF;color:#1E3A8A}
.rname{font-size:1.45rem;font-weight:900;text-wrap:balance;line-height:1.2}
.rtip{color:var(--muted);max-width:36ch;min-height:2.9em}
.rtm{position:relative;width:150px;height:150px}.rtm svg{width:100%;height:100%}
.rtm b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.2rem;font-weight:900;font-variant-numeric:tabular-nums}
.rnext{font-size:.88rem;color:var(--muted);min-height:1.4em}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.rstats div{background:var(--card2);border-radius:14px;padding:8px 4px}.rstats b{display:block;font-variant-numeric:tabular-nums}.rstats span{font-size:.7rem;color:var(--muted)}
.ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.conf{position:fixed;top:-20px;width:9px;height:14px;z-index:500;border-radius:2px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}

/* profile */
.phero{background:linear-gradient(150deg,#1b2a21,#2b1c09);color:#fff;border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 16px 36px rgba(255,120,20,.18)}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#FFB35E,#E8590C);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:900;flex:none;box-shadow:0 0 0 4px rgba(255,153,51,.25)}
.phero .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.phero .st{background:rgba(255,255,255,.08);border-radius:14px;padding:8px 4px;text-align:center}
.phero .st b{display:block;font-size:1rem;font-variant-numeric:tabular-nums}.phero .st span{font-size:.68rem;color:#cfd8d2}
.stats2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card2);border-radius:16px;padding:10px 12px}.stat b{display:block;font-size:1.1rem;font-variant-numeric:tabular-nums}
.bmi{position:relative;height:14px;border-radius:99px;margin:22px 0 6px;background:linear-gradient(90deg,#5AA2FF 0%,#3DD68C 22%,#3DD68C 42%,#F5C542 60%,#FF9933 76%,#E5484D 100%)}
.bmi i{position:absolute;top:-7px;width:6px;height:28px;border-radius:3px;background:var(--fg);box-shadow:0 0 0 2px var(--bg);transform:translateX(-3px);transition:left .8s ease}
.bmil{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
.switch{position:relative;width:58px;height:34px;border-radius:99px;border:1px solid var(--line);background:var(--track);padding:0;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--fg);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}.switch[aria-checked="true"]::after{transform:translateX(24px);background:#1B1713}
.sr{display:flex;align-items:center;gap:12px;padding:6px 0}
.sr .ic{width:42px;height:42px;border-radius:13px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex:none}
.hist{display:flex;align-items:center;gap:10px;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.hist:first-of-type{border-top:0}

#onb{position:fixed;inset:0;z-index:150;background:var(--bg);display:none;overflow-y:auto}#onb.open{display:block}

.dots{display:flex;gap:8px}.dots i{height:6px;flex:1;border-radius:99px;background:var(--track);transition:background .3s}.dots i.on{background:linear-gradient(90deg,#FFB35E,#FF8A1F)}
.obhero{font-size:2.6rem;line-height:1}
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;width:100%;min-height:60px}
.opt b{font-size:1rem}.opt span{font-size:.85rem;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--card2);box-shadow:inset 0 0 0 1px var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px}
.ob-step{display:none;flex-direction:column;gap:14px}.ob-step.on{display:flex;animation:enter .28s ease both}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:.9rem;z-index:400;max-width:90%;text-align:center;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}#splash .logo{animation:none}}

#toast{display:flex;align-items:center;gap:12px}

.frow{padding:6px 0;gap:8px}
.fmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;text-align:left;padding:4px 0;min-height:52px}
.fmain .em{font-size:1.5rem;width:40px;height:40px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:none}

.fadd.ok{background:var(--ok);color:#fff}

.cats{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin:0 -2px}
.cats button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-weight:700;font-size:.85rem;min-height:38px;white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1B1713}
.qa{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}
.qchip{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card2);border-radius:16px;padding:8px 12px;font-weight:700;font-size:.9rem;min-height:46px;white-space:nowrap}
.qchip .e{font-size:1.3rem}
.gs .it{display:flex;align-items:center;gap:12px;background:var(--card2);border:0;border-radius:14px;padding:10px 12px;width:100%;text-align:left;min-height:50px;font-weight:700}
.gs .it .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;font-size:.9rem}

    var d1=[Math.sin(a[0]*DEG),Math.cos(a[0]*DEG)],d2=[Math.sin(a[1]*DEG),Math.cos(a[1]*DEG)];
    var m=[o[0]+d1[0]*l1,o[1]+d1[1]*l1];

  var L1=lim([px,py],P.l1,LEN.th,LEN.sh),L2=lim([px,py],P.l2,LEN.th,LEN.sh);
  var pts=[h,n,[px,py],A1[0],A1[1],A2[0],A2[1],L1[0],L1[1],L2[0],L2[1]];
  var maxy=-1e9,i;

function undoAdd(r){
  var a=logs[r.k]||[];r.ids.forEach(function(id){for(var i=a.length-1;i>=0;i--)if(a[i].id===id){a.splice(i,1);break}});
  if(!a.length)delete logs[r.k];S.set('logs',logs);renderAll();
}
function topFoods(n){
  var c={};Object.keys(logs).forEach(function(k){logs[k].forEach(function(e){c[e.nm]=(c[e.nm]||0)+1})});
  var out=[];Object.keys(c).sort(function(a,b){return c[b]-c[a]}).forEach(function(nm){var f=FOODS.filter(function(x){return x.n===nm})[0];if(f&&out.length<n)out.push(f)});
  ['Roti','Dal','Rice, cooked','Chai with milk and sugar','Boiled egg','Banana','Curd / dahi','Poha'].forEach(function(nm){
    var f=FOODS.filter(function(x){return x.n===nm})[0];if(f&&out.length<n&&out.indexOf(f)<0)out.push(f)});
  return out;
}

/* ---------- navigation ---------- */
function setTab(t){

  tab=t;
  $$('.screen').forEach(function(s){s.classList.toggle('on',s.id==='s-'+t)});
  $$('#nav button').forEach(function(b){if(b.dataset.tab===t)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  window.scrollTo(0,0);render(t);
}
function render(t){t=t||tab;if(t==='home')renderHome();else if(t==='log')renderLog();else if(t==='workouts')renderWorkouts();else if(t==='profile')renderProfile()}

var ov=null;
function ovOpen(name,closeFn){ov={name:name,close:closeFn};try{history.pushState({ov:name},'')}catch(e){}}
function ovClose(){if(!ov)return;var o=ov;ov=null;o.close();try{if(history.state&&history.state.ov)history.back()}catch(e){}}

/* ---------- rings, bottle, confetti ---------- */
function ringsSvg(items){
  var w=11,gap=3,h='';
  items.forEach(function(v,i){
    var rad=88-i*(w+gap),circ=2*Math.PI*rad,p=clamp(v.pct,0,1);
    h+='<circle cx="100" cy="100" r="'+rad+'" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="'+w+'"/>';
    h+='<circle class="rg" cx="100" cy="100" r="'+rad+'" fill="none" stroke="'+v.color+'" stroke-width="'+w+'" stroke-linecap="round" stroke-dasharray="'+circ.toFixed(1)+'" stroke-dashoffset="'+circ.toFixed(1)+'" data-off="'+(circ*(1-p)).toFixed(1)+'" transform="rotate(-90 100 100)"/>';
  });
  return '<svg viewBox="0 0 200 200" aria-hidden="true">'+h+'</svg>';
}
function animateRings(root){requestAnimationFrame(function(){requestAnimationFrame(function(){$$('.rg',root).forEach(function(c){c.style.strokeDashoffset=c.getAttribute('data-off')})})})}
function bottleSvg(p){
  var y=(132-118*clamp(p,0,1)).toFixed(1);
  var w='M-80 '+y+' q20 -8 40 0 t40 0 t40 0 t40 0 t40 0 V140 H-80z';
  return '<svg class="bottle" viewBox="0 0 80 140" aria-hidden="true"><defs><clipPath id="bc"><path d="M28 8h24v14c0 6 14 12 14 30v70a10 10 0 0 1-10 10H24a10 10 0 0 1-10-10V52c0-18 14-24 14-30z"/></clipPath></defs><g clip-path="url(#bc)"><path class="wave2" d="'+w+'" transform="translate(0,3)"/><path class="wave" d="'+w+'"/></g><path class="bo" d="M28 8h24v14c0 6 14 12 14 30v70a10 10 0 0 1-10 10H24a10 10 0 0 1-10-10V52c0-18 14-24 14-30z"/></svg>';
}
function confetti(){
  var cols=['#FF9933','#3DD68C','#F5C542','#5AA2FF','#FF6B6B','#fff'];
  for(var i=0;i<46;i++){
    var d=document.createElement('i');d.className='conf';
    d.style.left=(Math.random()*100)+'vw';d.style.background=cols[i%cols.length];
    d.style.animationDuration=(1.8+Math.random()*1.8)+'s';d.style.animationDelay=(Math.random()*.5)+'s';
    d.style.transform='rotate('+r0(Math.random()*360)+'deg)';
    document.body.appendChild(d);
    (function(n){setTimeout(function(){if(n.parentNode)n.parentNode.removeChild(n)},4200)})(d);
  }
}

/* ---------- WORKOUTS ---------- */
function estKcal(w,minutes){return Math.round(w.met*(profile?profile.weight:60)*minutes/60)}
function exOf(w,i){return EX[w.ex[i]]}
function buildSteps(w){
  var steps=[{type:'ready',ex:exOf(w,0),sec:5}],r,i;
  for(r=0;r<w.rounds;r++)for(i=0;i<w.ex.length;i++){
    steps.push({type:'work',ex:exOf(w,i),sec:w.work,round:r+1});
    var last=(r===w.rounds-1&&i===w.ex.length-1);
    if(!last&&w.rest>0)steps.push({type:'rest',ex:i<w.ex.length-1?exOf(w,i+1):exOf(w,0),sec:w.rest});
  }
  return steps;
}
function totalSec(w){return buildSteps(w).slice(1).reduce(function(a,s){return a+s.sec},0)}
function thumb(w){var e=exOf(w,w.id==='surya'?4:0);return figSvg(e.k[e.k.length>1?1:0],!!e.front)}

      '<div class="seg" style="gap:6px"><span class="chip">⏱ ~'+mins+' '+T('min')+'</span><span class="chip">'+T('lvl_'+w.lvl)+'</span><span class="chip">🔥 ~'+estKcal(w,mins)+' kcal</span>'+(w.rest?'<span class="chip">'+T('work_s',w.work)+' / '+T('rest_s',w.rest)+'</span>':'<span class="chip">'+T('work_s',w.work)+'</span>')+'<span class="chip">'+T('rounds_n',w.rounds)+'</span></div>'+
      '<button type="button" class="btn" data-act="startWk" data-id="'+w.id+'">▶ '+T('start')+'</button>'+

  });

  el.innerHTML=h;

/* voice */
var audio=null,wake=null;
function beep(f,d){try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();var o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=0.07;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function pickVoice(){
  try{
    var vs=speechSynthesis.getVoices()||[],pre=LANG==='hi'?['hi']:['en-in','en'],i,j;
    for(i=0;i<pre.length;i++)for(j=0;j<vs.length;j++)if(vs[j].lang.toLowerCase().replace('_','-').indexOf(pre[i])===0)return vs[j];
  }catch(e){}
  return null;
}
function say(txt){
  if(!voiceOn||!txt||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(txt);u.lang=LANG==='hi'?'hi-IN':'en-IN';var v=pickVoice();if(v)u.voice=v;u.rate=LANG==='hi'?0.95:1;speechSynthesis.speak(u)}catch(e){}
}
function sayNum(n){say(LANG==='hi'?['','एक','दो','तीन'][n]:String(n))}
function reqWake(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wake=l}).catch(function(){})}catch(e){}}
function relWake(){try{if(wake){wake.release();wake=null}}catch(e){}}

/* runner */
var run=null,tick=null,raf=null;
var RC=2*Math.PI*66;
function startWorkout(id){
  var w=WORKOUTS.filter(function(x){return x.id===id})[0];if(!w)return;
  var steps=buildSteps(w),cum=[0],i;
  for(i=0;i<steps.length;i++)cum.push(cum[i]+(steps[i].type==='ready'?0:steps[i].sec));
  var first=steps[0].ex;
  run={w:w,steps:steps,cum:cum,total:cum[steps.length],i:0,left:steps[0].sec*1000,end:0,paused:false,spoken:{},finished:false,disp:first.k[0].slice(),animT:0,last:performance.now()};
  run.end=Date.now()+run.left;
  var rn=$('#runner');
  rn.innerHTML='<div class="rin"><div class="rtop"><button type="button" class="ib" data-act="runStop" aria-label="'+T('stop')+'">&times;</button><div class="segs" id="rsegs"></div><button type="button" class="ib" data-act="voice" id="rvoice" aria-label="'+T('voice')+'"></button></div>'+
    '<div class="rfig" id="rfig" style="background:linear-gradient(135deg,'+w.c[1]+',#1a120a)"><svg class="fig" id="rsvg" viewBox="0 0 200 200" aria-hidden="true">'+figInner(run.disp,!!first.front)+'</svg></div>'+
    '<div class="rph ready" id="rph"></div><div class="rname" id="rname"></div><p class="rtip" id="rtip"></p>'+
    '<div class="rtm"><svg viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="66" fill="none" stroke="var(--track)" stroke-width="10"/><circle id="rcirc" cx="75" cy="75" r="66" fill="none" stroke="#FF9933" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+RC.toFixed(1)+'" stroke-dashoffset="0" transform="rotate(-90 75 75)"/></svg><b id="rtm"></b></div>'+
    '<div class="rnext" id="rnext"></div>'+
    '<div class="rstats"><div><b id="rel">0:00</b><span>'+T('elapsed')+'</span></div><div><b id="rlf">0:00</b><span>'+T('remain')+'</span></div><div><b id="rkc">0</b><span>kcal</span></div></div>'+
    '<div class="ctl"><button type="button" class="btn ghost" data-act="runPrev">⏮ '+T('prev')+'</button><button type="button" class="btn" data-act="runPause" id="rpause">'+T('pause')+'</button><button type="button" class="btn ghost" data-act="runSkip">'+T('skip')+' ⏭</button></div></div>';
  var sg='';steps.forEach(function(s){if(s.type==='work')sg+='<i></i>'});$('#rsegs').innerHTML=sg;
  rn.classList.add('open');document.body.classList.add('lock');
  ovOpen('runner',function(){stopRun()});
  setVoiceBtn();enterStep(true);reqWake();
  tick=setInterval(onTick,200);raf=requestAnimationFrame(frame);
}
function setVoiceBtn(){var b=$('#rvoice');if(b){b.textContent=voiceOn?'🔊':'🔇';b.title=voiceOn?T('v_on'):T('v_off')}}
function stopRun(){clearInterval(tick);tick=null;if(raf)cancelAnimationFrame(raf);raf=null;relWake();try{speechSynthesis.cancel()}catch(e){}
  $('#runner').classList.remove('open');document.body.classList.remove('lock');run=null}
function elapsedSec(){if(!run)return 0;var s=run.steps[run.i];var inStep=s.type==='ready'?0:(s.sec-run.left/1000);return run.cum[run.i]+Math.max(0,inStep)}
function enterStep(first){
  var s=run.steps[run.i],w=run.w,ex=s.ex,nm=L2(ex.n);
  run.spoken={};run.disp=run.disp||ex.k[0].slice();
  var ph=$('#rph');ph.className='rph '+s.type;
  ph.textContent=(s.type==='work'?T('ph_work'):s.type==='rest'?T('ph_rest'):T('ph_ready'))+(s.type==='work'&&w.rounds>1?' · '+T('round_of',s.round,w.rounds):'');
  $('#rname').textContent=s.type==='rest'?T('ph_rest'):nm;
  $('#rtip').textContent=s.type==='ready'?L2(w.n):s.type==='rest'?T('next_up',nm):L2(ex.d);
  var nx='';
  if(s.type==='work'){var j=run.i+1;while(j<run.steps.length&&run.steps[j].type==='rest')j++;if(j<run.steps.length)nx=T('next_up',L2(run.steps[j].ex.n))}
  $('#rnext').textContent=nx;
  var c=$('#rcirc');c.setAttribute('stroke',s.type==='work'?'#FF9933':s.type==='rest'?'#3DD68C':'#5AA2FF');
  var wi=0,k;for(k=0;k<run.i;k++)if(run.steps[k].type==='work')wi++;
  $$('#rsegs i').forEach(function(e,idx){var cur=s.type==='work'?wi:wi-1;e.className=idx<cur?'dn':idx===cur&&s.type==='work'?'on':''});
  $('#rtm').textContent=Math.ceil(run.left/1000);
  /* voice + sound */
  if(s.type==='ready')say(T('say_start',L2(w.n),nm));
  else if(s.type==='work'){say(T('say_go',nm)+(w.work>=25&&s.round===1&&w.id!=='surya'&&voiceOn?' '+L2(ex.d):''))}
  else say(T('say_rest',nm));
  if(!first){beep(s.type==='work'?880:520,0.2);vib(s.type==='work'?[120,60,120]:200)}
}
function goStep(i){
  if(!run)return;run.i=clamp(i,0,run.steps.length-1);run.left=run.steps[run.i].sec*1000;run.end=Date.now()+run.left;run.paused=false;
  var p=$('#rpause');if(p)p.textContent=T('pause');enterStep(false);
}
function onTick(){
  if(!run||run.paused||run.finished)return;
  var left=run.end-Date.now();
  if(left<=0){if(run.i>=run.steps.length-1){finishRun(true);return}goStep(run.i+1);return}
  run.left=left;
  var s=run.steps[run.i],sc=Math.ceil(left/1000),b=$('#rtm');
  if(b&&b.textContent!==String(sc)){
    b.textContent=sc;
    if(sc<=3&&sc>0&&!run.spoken['c'+sc]){run.spoken['c'+sc]=1;if(voiceOn)sayNum(sc);else beep(660,0.08)}
    else if(s.type==='work'&&s.sec>=25&&sc===10&&!run.spoken.t10){run.spoken.t10=1;say(T('say_10'))}
    else if(s.type==='work'&&s.sec>=30&&sc===Math.floor(s.sec/2)&&!run.spoken.half){run.spoken.half=1;say(T('say_half'))}
  }
  var c=$('#rcirc');if(c)c.style.strokeDashoffset=String(RC*(1-left/(s.sec*1000)));
  var el=elapsedSec();
  $('#rel').textContent=mmss(el);$('#rlf').textContent=mmss(run.total-el);$('#rkc').textContent=estKcal(run.w,el/60);
}
function lerpArr(a,b,t){var o=new Array(a.length),i;for(i=0;i<a.length;i++)o[i]=a[i]+(b[i]-a[i])*t;return o}
function frame(now){
  if(!run){return}
  var dt=Math.min(0.06,(now-run.last)/1000);run.last=now;
  if(!run.finished){
    if(!run.paused)run.animT+=dt;
    var s=run.steps[run.i],ex=s.ex,tgt;
    if(s.type!=='work'||ex.k.length===1){tgt=ex.k[0]}
    else{
      var n=ex.k.length,u=((run.animT/ex.per)%1)*n,seg=Math.floor(u),f=u-seg;f=f*f*(3-2*f);
      tgt=lerpArr(ex.k[seg%n],ex.k[(seg+1)%n],f);
    }
    var br=Math.sin(run.animT*1.8)*(ex.hold||ex.k.length===1||s.type!=='work'?1.4:0);
    var a=1-Math.exp(-dt*(s.type==='work'&&ex.per<1.5?14:8)),i;
    for(i=0;i<run.disp.length;i++)run.disp[i]+=(tgt[i]-run.disp[i])*a;
    var arr=run.disp.slice();for(i=1;i<arr.length;i+=2)arr[i]+=br;
    var svg=$('#rsvg');
    if(svg){
      var L=figLines(arr,!!ex.front),ls=svg.querySelectorAll('line:not(.gl)'),hd=svg.querySelector('.hd');
      for(i=0;i<L.length&&i<ls.length;i++){var q=L[i],e=ls[i];e.setAttribute('x1',q[0].toFixed(1));e.setAttribute('y1',q[1].toFixed(1));e.setAttribute('x2',q[2].toFixed(1));e.setAttribute('y2',q[3].toFixed(1));e.setAttribute('class',q[4])}
      hd.setAttribute('cx',arr[0].toFixed(1));hd.setAttribute('cy',arr[1].toFixed(1));
    }
  }
  raf=requestAnimationFrame(frame);
}
function runPause(){
  if(!run||run.finished)return;
  if(run.paused){run.paused=false;run.end=Date.now()+run.left;try{if(voiceOn&&'speechSynthesis' in window)speechSynthesis.resume()}catch(e){}}
  else{run.paused=true;run.left=Math.max(0,run.end-Date.now())}
  $('#rpause').textContent=run.paused?T('resume'):T('pause');
}
function runPrev(){
  if(!run||run.finished)return;
  var cur=run.steps[run.i],sinceStart=cur.sec*1000-run.left;
  if(sinceStart>3000){goStep(run.i);return}
  var j=run.i-1;while(j>0&&run.steps[j].type!=='work')j--;goStep(Math.max(0,j));
}

function drawWeight(wk){
  var el=$('#wChart');if(!el)return;
  if(!wk.length){el.innerHTML='<p class="small muted">'+T('wchart')+'</p>';return}
  var pts=wk.slice(-30).map(function(k){return {k:k,w:weights[k]}}),ws=pts.map(function(p){return p.w}),mn=Math.min.apply(null,ws),mx=Math.max.apply(null,ws);
  if(mx-mn<1){mx+=.5;mn-=.5}
  var W=300,H=110,pl=34,pr=8,pt=10,pb=14;
  var xs=function(i){return pts.length===1?(pl+W-pr)/2:pl+i*(W-pl-pr)/(pts.length-1)},ys=function(v){return pt+(mx-v)/(mx-mn)*(H-pt-pb)};
  var line=pts.map(function(p,i){return xs(i).toFixed(1)+','+ys(p.w).toFixed(1)}).join(' ');
  var last=pts[pts.length-1],ch=last.w-weights[wk[0]];
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Weight"><line x1="'+pl+'" y1="'+ys(mx)+'" x2="'+(W-pr)+'" y2="'+ys(mx)+'" stroke="var(--line)"/><line x1="'+pl+'" y1="'+ys(mn)+'" x2="'+(W-pr)+'" y2="'+ys(mn)+'" stroke="var(--line)"/>'+
   '<text x="'+(pl-4)+'" y="'+(ys(mx)+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+mx.toFixed(1)+'</text><text x="'+(pl-4)+'" y="'+(ys(mn)+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+mn.toFixed(1)+'</text>'+
   (pts.length>1?'<polyline points="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>':'')+'<circle cx="'+xs(pts.length-1)+'" cy="'+ys(last.w)+'" r="4.5" fill="var(--accent)"/></svg>'+
   '<p class="small muted num">'+r1(last.w)+' kg &middot; '+T('wsince',(ch>0?'+':'')+r1(ch))+'</p>';
}
